# 정적 파일 + /api 프록시. 시뮬레이터 API 만 동적이다.
limit_req_zone $binary_remote_addr zone=api:1m rate=5r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    client_max_body_size 32k;

    # 앞단이 Cloudflare 터널이라 컨테이너에는 도커 브리지 주소만 보인다. 그대로 두면 요청 제한이
    # 방문자 전체에 한꺼번에 걸리므로 Cloudflare 가 붙이는 방문자 주소를 쓴다. 포트는 127.0.0.1 에만
    # 열려 있어 이 헤더를 붙일 수 있는 건 같은 기기의 터널뿐이다(Cloudflare 는 방문자가 보낸 값을 덮어쓴다).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # 빌드 산출물은 파일명에 해시가 붙는다 → 오래 캐시
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}

# www 로 들어오면 기본 주소로 보낸다(주소를 하나로 모은다).
server {
    listen 80;
    server_name www.hwangjunseok.dev;
    server_tokens off;
    return 301 https://hwangjunseok.dev$request_uri;
}
