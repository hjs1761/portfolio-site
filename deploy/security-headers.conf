# 모든 응답에 붙는 보안 헤더. nginx 는 location 안에 add_header 가 하나라도 있으면 server 블록의
# add_header 를 상속하지 않으므로, 각 블록에서 이 파일을 include 한다.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# 외부는 방문 통계(Cloudflare Web Analytics)만 — 스크립트 주소와 전송 주소. web/public/js/stats.js 참고.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
